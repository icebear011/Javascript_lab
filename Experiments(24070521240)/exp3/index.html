<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Student Marks & Grading System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    h2,
    h3 {
      color: #333;
    }

    .form-group {
      margin-bottom: 10px;
    }

    label {
      display: inline-block;
      width: 120px;
    }

    input {
      padding: 5px;
    }

    button {
      padding: 6px 14px;
      margin-top: 5px;
      cursor: pointer;
    }

    .error {
      color: red;
      font-weight: bold;
      margin-top: 10px;
    }

    table {
      width: 100%;
      max-width: 500px;
      border-collapse: collapse;
      margin-top: 15px;
    }

    table,
    th,
    td {
      border: 1px solid #ccc;
    }

    th,
    td {
      padding: 8px;
      text-align: left;
    }

    th {
      background-color: #f2f2f2;
    }

    .summary {
      margin-top: 15px;
      padding: 10px;
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      max-width: 500px;
    }
  </style>
</head>

<body>

  <h2>Student Grading System - 24070521240</h2>

  <form id="gradeForm" onsubmit="return false;">
    <div class="form-group">
      <label for="subject">Subject Name:</label>
      <input type="text" id="subject" placeholder="e.g. Mathematics">
    </div>
    <div class="form-group">
      <label for="marks">Marks (0-100):</label>
      <input type="number" id="marks" placeholder="e.g. 85">
    </div>
    <button onclick="addSubject()">Add Subject</button>
  </form>

  <div id="errorMsg" class="error"></div>

  <h3>Subject List</h3>
  <table>
    <thead>
      <tr>
        <th>Subject</th>
        <th>Marks</th>
        <th>Grade</th>
      </tr>
    </thead>
    <tbody id="subjectTable">
      <!-- Dynamic Rows -->
    </tbody>
  </table>

  <div id="summary" class="summary" style="display: none;">
    <h3>Overall Summary</h3>
    <p><strong>Total Marks:</strong> <span id="totalMarks">0</span></p>
    <p><strong>Percentage:</strong> <span id="percentage">0</span>%</p>
    <p><strong>Overall Grade:</strong> <span id="overallGrade">-</span></p>
    <p><strong>Result:</strong> <span id="result">-</span></p>
  </div>

  <script>
    // Array to store subject objects
    let subjects = [];

    // Control Structure: Function using if-else statements to determine grade
    function calculateGrade(marks) {
      if (marks >= 90) {
        return 'A+';
      } else if (marks >= 80) {
        return 'A';
      } else if (marks >= 70) {
        return 'B';
      } else if (marks >= 60) {
        return 'C';
      } else if (marks >= 50) {
        return 'D';
      } else {
        return 'F';
      }
    }

    // Function for form validation and adding subject
    function addSubject() {
      let subjectInput = document.getElementById("subject");
      let marksInput = document.getElementById("marks");
      let errorDiv = document.getElementById("errorMsg");

      let subjectName = subjectInput.value.trim();
      let marksValue = marksInput.value.trim();

      // Form Validation using Control Structures
      if (subjectName === "") {
        errorDiv.innerText = "Error: Subject name cannot be empty.";
        return;
      }

      if (marksValue === "" || isNaN(marksValue)) {
        errorDiv.innerText = "Error: Please enter valid numerical marks.";
        return;
      }

      let marks = parseFloat(marksValue);

      if (marks < 0 || marks > 100) {
        errorDiv.innerText = "Error: Marks must be between 0 and 100.";
        return;
      }

      // Clear previous error message if validation succeeds
      errorDiv.innerText = "";

      // Calculate grade for the subject
      let grade = calculateGrade(marks);

      // Add subject to list
      subjects.push({ name: subjectName, marks: marks, grade: grade });

      // Reset form fields
      subjectInput.value = "";
      marksInput.value = "";

      // Update table display and summary
      updateUI();
    }

    // Function to update the table and calculations using a loop
    function updateUI() {
      let tableBody = document.getElementById("subjectTable");
      tableBody.innerHTML = "";

      let total = 0;

      // Control Structure: for loop to process all subjects
      for (let i = 0; i < subjects.length; i++) {
        total += subjects[i].marks;

        let row = `<tr>
          <td>${subjects[i].name}</td>
          <td>${subjects[i].marks}</td>
          <td>${subjects[i].grade}</td>
        </tr>`;
        tableBody.innerHTML += row;
      }

      // Calculate total percentage and overall grade
      if (subjects.length > 0) {
        let percentage = total / subjects.length;
        let overallGrade = calculateGrade(percentage);
        let result = percentage >= 50 ? "PASS" : "FAIL";

        document.getElementById("totalMarks").innerText = total;
        document.getElementById("percentage").innerText = percentage.toFixed(2);
        document.getElementById("overallGrade").innerText = overallGrade;
        document.getElementById("result").innerText = result;

        document.getElementById("summary").style.display = "block";
      }
    }
  </script>
</body>

</html>
